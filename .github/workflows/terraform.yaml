name: Terraform CI

on:
  push:
    branches: [dev]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yaml"
  pull_request:
    branches: [dev]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yaml"
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - run: terraform -chdir=./terraform init
      - run: terraform -chdir=./terraform validate
      - run: terraform -chdir=./terraform plan -out=tfplan
      - run: terraform -chdir=./terraform apply -auto-approve tfplan

      - name: Save outputs
        run: |
          echo "EC2_PUBLIC_IP=$(terraform -chdir=./terraform output -raw ec2_public_ip)" > ./terraform/outputs.env
          echo "EC2_INSTANCE_ID=$(terraform -chdir=./terraform output -raw ec2_instance_id)" >> ./terraform/outputs.env
          echo "VPC_ID=$(terraform -chdir=./terraform output -raw vpc_id)" >> ./terraform/outputs.env
          echo "SUBNET_ID=$(terraform -chdir=./terraform output -raw subnet_id)" >> ./terraform/outputs.env

      - uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs
          path: ./terraform/outputs.env

      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: terraform-completed
