---
name: Continuous Deployment Workflow

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/deploy.yaml"

  repository_dispatch:
    types:
      - backend-image-pushed
      - frontend-image-pushed
      - terraform-completed

  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download Terraform outputs (if exist)
        run: |
          echo "Checking if Terraform artifact exists..."
          gh api repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[] | select(.name=="terraform-outputs") | .id' > artifact_id.txt
          if [ -s artifact_id.txt ]; then
            echo "Artifact exists, downloading..."
            gh run download-artifact terraform-outputs --dir ./terraform-data
          else
            echo "Terraform outputs artifact not found, skipping"
          fi


      - name: Load Terraform outputs safely
        run: |
          if [ -f ./terraform-data/outputs.env ]; then
            cat ./terraform-data/outputs.env >> $GITHUB_ENV
          else
            echo "Terraform outputs missing, skipping"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Copy project files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.EC2_PUBLIC_IP }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/${{ secrets.EC2_USER }}/dream-app"
          strip_components: 0

      - name: Create .env on EC2 and deploy via Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.EC2_PUBLIC_IP }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cat <<EOF > /home/${{ secrets.EC2_USER }}/dream-app/.env
            DB_USER=${{ secrets.DATABASE_USER }}
            DB_PASS=${{ secrets.DATABASE_PASSWD }}
            EOF

            cd /home/${{ secrets.EC2_USER }}/dream-app
            docker compose pull || echo "Docker pull failed"
            docker compose up -d --build || echo "Docker compose up failed"

      - name: Health check
        run: |
          sleep 30
          timeout 120 bash -c 'until curl -f http://${{ env.EC2_PUBLIC_IP }}:80; do sleep 5; done' || echo "Frontend may not be ready"
          timeout 120 bash -c 'until curl -f http://${{ env.EC2_PUBLIC_IP }}:3001; do sleep 5; done' || echo "Backend may not be ready"
