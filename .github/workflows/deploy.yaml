name: Continuous Deployment Workflow

on:
  push:
    branches: [dev]
    paths:
      - "terraform/**"
      - ".github/workflows/deploy.yaml"
  workflow_run:
    workflows: 
      - "Terraform CI"
      - "Backend Continuous Integration Workflow"
      - "Frontend Continuous Integration Workflow"
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Download Terraform outputs (must exist from terraform.yaml)
    - name: Download Terraform outputs
      uses: actions/download-artifact@v4
      with:
        name: terraform-outputs
        path: ./terraform-data

    - name: Load Terraform outputs into env
      run: |
        cat ./terraform-data/* >> $GITHUB_ENV

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Validate infrastructure
      run: |
        if [ -z "${{ env.EC2_PUBLIC_IP }}" ]; then
          echo "Error: EC2 public IP not found."
          exit 1
        fi
        echo "EC2 Public IP: ${{ env.EC2_PUBLIC_IP }}"
        echo "EC2 Instance ID: ${{ env.EC2_INSTANCE_ID }}"

    - name: Test EC2 SSH connectivity
      run: |
        timeout 30 bash -c 'until nc -z ${{ env.EC2_PUBLIC_IP }} 22; do sleep 2; done' || {
          echo "Error: Cannot connect to EC2 over SSH"
          exit 1
        }

    - name: Copy project files to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ env.EC2_PUBLIC_IP }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "."
        target: "/home/${{ secrets.EC2_USER }}/dream-app"
        strip_components: 0

    - name: Create .env on EC2
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ env.EC2_PUBLIC_IP }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cat <<EOF > /home/${{ secrets.EC2_USER }}/dream-app/.env
          DB_USER=${{ secrets.DATABASE_USER }}
          DB_PASS=${{ secrets.DATABASE_PASSWD }}
          EOF

    - name: Deploy via Docker Compose
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ env.EC2_PUBLIC_IP }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/${{ secrets.EC2_USER }}/dream-app
          docker compose pull
          docker compose up -d --build

    - name: Health check
      run: |
        sleep 30
        timeout 60 bash -c 'until curl -f http://${{ env.EC2_PUBLIC_IP }}:80; do sleep 5; done' || echo "Warning: Frontend may not be ready"
        timeout 60 bash -c 'until curl -f http://${{ env.EC2_PUBLIC_IP }}:3001; do sleep 5; done' || echo "Warning: Backend may not be ready"
